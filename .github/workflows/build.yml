name: Build MyVault

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name MyVault main.py

      - name: Upload MyVault.exe
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-Windows
          path: dist/MyVault.exe
          retention-days: 7
